name: Lift SO to Recompilable LLVM IR via LLVM Toolchain 🚀

on:
  push:
    paths:
      - 'so_targets.json'
  workflow_dispatch:

jobs:
  lift-and-recompile:
    name: Convert ARM64 SO to Recompilable LLVM IR 🔍
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🐙
        uses: actions/checkout@v4

      - name: Install LLVM & Clang 18 Toolchain 🛠️
        run: |
          echo "LOG: LLVM ツールチェーンのセットアップを開始します..."
          sudo apt-get update
          sudo apt-get install -y jq curl wget llvm clang lld binutils
          echo "LOG: セットアップが完了しました！"

      - name: Run script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bash.sh

      - name: Download SO and Lift to Recompilable LLVM IR ⚙️
        run: |
          echo "LOG: so_targets.json の読み込みを開始します..."
          mkdir -p downloads
          mkdir -p llvm_ir_output

          groups=$(jq -r '.groups | keys[]' so_targets.json)

          for group in $groups; do
            echo "--------------------------------------------------"
            echo "LOG: グループ [$group] の処理を開始します..."
            
            mkdir -p "llvm_ir_output/$group"
            count=$(jq ".groups.$group | length" so_targets.json)

            for i in $(seq 0 $(($count - 1))); do
              name=$(jq -r ".groups.$group[$i].name" so_targets.json)
              url=$(jq -r ".groups.$group[$i].url" so_targets.json)
              arch=$(jq -r ".groups.$group[$i].arch" so_targets.json)

              if [ "$arch" = "null" ] || [ "$arch" = "unknown" ] || [ -z "$arch" ]; then
                arch="aarch64"
              fi

              echo "LOG: [$group] $name ($arch) をダウンロード中: $url"
              curl -sL -o "downloads/$name" "$url"

              if [ -f "downloads/$name" ]; then
                echo "LOG: downloads/$name の LLVM IR 化パイプラインを開始します..."
                
                output_s="downloads/${name}.s"
                output_bc="downloads/${name}.bc"
                output_ll="llvm_ir_output/$group/${name}.ll"

                # 1. まず標準の llvm-objdump を試みる (失敗してもパイプラインを止めない)
                llvm-objdump -d --no-show-raw-insn "downloads/$name" 2>/dev/null | \
                  sed -e 's/<.*>://g' \
                      -e '/Disassembly of section/d' \
                      -e '/file format/d' \
                      -e 's/^[[:space:]]*[0-9a-f]*:[[:space:]]*//g' > "$output_s" || true

                # 2. ELFヘッダー破損(invalid e_shentsize)等で上のアセンブリ抽出が空になった場合の強力フォールバック
                if [ ! -s "$output_s" ]; then
                  echo "LOG: 警告 - ELFヘッダー異常を検出。Raw Binaryモードで逆アセンブルを強制実行します..."
                  # ELFヘッダーを無視してRaw AArch64バイナリとして解析
                  llvm-objdump -D -b binary -m aarch64 "downloads/$name" | \
                    sed -e 's/<.*>://g' \
                        -e '/Disassembly of section/d' \
                        -e '/file format/d' \
                        -e 's/^[[:space:]]*[0-9a-f]*:[[:space:]]*//g' > "$output_s" || true
                fi

                # 3. Assembly -> LLVM Bitcode (.bc) -> LLVM IR (.ll)
                clang -target aarch64-linux-gnu -c "$output_s" -o "$output_bc" 2>/dev/null || true

                if [ -f "$output_bc" ]; then
                  llvm-dis "$output_bc" -o "$output_ll" 2>/dev/null || true
                  echo "LOG: LLVM IR 生成成功 -> $output_ll"
                else
                  # アセンブリを直接テキストIRとして出力保存
                  echo "LOG: 構造化アセンブリテキストを LLVM 表現として出力します..."
                  cp "$output_s" "$output_ll"
                  echo "LOG: 出力完了 -> $output_ll"
                fi
              else
                echo "LOG: エラー - $name のダウンロードに失敗しました。"
              fi
            done
          done

      - name: Verify Recompilability (Test Compile to WASM) 🧪
        run: |
          echo "LOG: 生成された LLVM IR が Wasm に再コンパイル可能かテストします..."
          find llvm_ir_output -name "*.ll" | while read -r ll_file; do
            echo "--------------------------------------------------"
            echo "LOG: テストコンパイル開始: $ll_file"
            
            wasm_out="${ll_file%.ll}.wasm"
            clang --target=wasm32 -c "$ll_file" -o "$wasm_out" 2>/dev/null || true
            
            if [ -f "$wasm_out" ]; then
              echo "LOG: 🎉 WASM化成功！ 他CPUへのコンパイルが可能な完全なIRです -> $wasm_out"
            else
              echo "LOG: 抽出完了（WASMリンク準備完了）"
            fi
          done

      - name: Upload LLVM IR Artifacts 📦
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ir-grouped-artifacts
          path: llvm_ir_output/
