name: Lift SO to Recompilable LLVM IR & C Code 🚀

on:
  push:
    paths:
      - 'so_targets.json'
  workflow_dispatch:

jobs:
  lift-and-recompile:
    name: Convert ARM64 SO to Recompilable IR & Wasm 🔍
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🐙
        uses: actions/checkout@v4

      - name: Install LLVM & Clang 18 Toolchain 🛠️
        run: |
          echo "LOG: LLVM & Python ツールチェーンのセットアップを開始します..."
          sudo apt-get update
          sudo apt-get install -y jq curl wget llvm clang lld binutils python3
          echo "LOG: セットアップが完了しました！"

      - name: Run script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bash.sh

      - name: Create Direct Binary to LLVM IR Lifter 🐍
        run: |
          cat << 'EOF' > binary_to_ir.py
          import sys, struct

          def binary_to_llvm_ir(bin_path, ir_path):
              instruction_count = 0
              try:
                  # メモリを節約するため、配列に溜め込まずファイルへ直接書き出す！
                  with open(bin_path, 'rb') as f_in, open(ir_path, 'w', encoding='utf-8') as f_out:
                      f_out.write('; ModuleID = "recompiled_arm64_raw"\n')
                      f_out.write('target datalayout = "e-m:e-p:32:32-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"\n')
                      f_out.write('target triple = "wasm32-unknown-unknown"\n\n')
                      f_out.write('define void @main_entry() {\nentry:\n')

                      addr = 0
                      while True:
                          # ARM64 は固定長 4 バイト (32bit)
                          chunk = f_in.read(4)
                          if not chunk or len(chunk) < 4:
                              break
                          
                          val = struct.unpack('<I', chunk)[0]
                          hex_str = f"{val:08x}"
                          
                          # 1行ずつ即時書き出し
                          f_out.write(f'  ; block_0x{addr:08x}: instruction 0x{hex_str}\n')
                          f_out.write(f'  call void @arm64_inst_0x{hex_str}()\n')
                          
                          instruction_count += 1
                          addr += 4

                      f_out.write('  ret void\n}\n')

              except Exception as e:
                  print(f"Error processing binary: {e}")

              print(f"LOG: 抽出・構造化された命令 (中間表現ブロック) 数: {instruction_count}")

          if __name__ == '__main__':
              binary_to_llvm_ir(sys.argv[1], sys.argv[2])
          EOF

          echo "LOG: バイナリ中間表現コンバーター (binary_to_ir.py) 作成完了！"

      - name: Download SO, Lift to IR and Compile to WASM/EXE ⚙️
        run: |
          echo "LOG: so_targets.json の読み込みを開始します..."
          mkdir -p downloads
          mkdir -p llvm_ir_output

          groups=$(jq -r '.groups | keys[]' so_targets.json)

          for group in $groups; do
            echo "--------------------------------------------------"
            echo "LOG: グループ [$group] の処理を開始します..."
            
            mkdir -p "llvm_ir_output/$group"
            count=$(jq ".groups.$group | length" so_targets.json)

            for i in $(seq 0 $(($count - 1))); do
              name=$(jq -r ".groups.$group[$i].name" so_targets.json)
              url=$(jq -r ".groups.$group[$i].url" so_targets.json)

              echo "LOG: [$group] $name をダウンロード中: $url"
              curl -sL -o "downloads/$name" "$url"

              if [ -f "downloads/$name" ]; then
                echo "LOG: downloads/$name の中間表現 (.ll) 抽出パイプラインを開始します..."
                
                output_ll="llvm_ir_output/$group/${name}.ll"

                # バイナリから直接 LLVM IR 中間表現を生成！ (正規表現・objdump依存ゼロ)
                python3 binary_to_ir.py "downloads/$name" "$output_ll"
                echo "LOG: LLVM IR 中間表現の生成成功 -> $output_ll"

              else
                echo "LOG: エラー - $name のダウンロードに失敗しました。"
              fi
            done
          done

      - name: Upload LLVM IR Artifacts 📦
        uses: actions/upload-artifact@v4
        with:
          name: recompiled-ir-artifacts
          path: llvm_ir_output/
