name:  Jar2Wasm Pipeline v2 !

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 必要なコンパイラ＆ツールのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            default-jdk \
            python3 \
            llvm \
            clang \
            lld \
            wabt \
            unzip

      - name: サンプルJARの用意（テスト用）
        run: |
          echo "Simple"
          curl -L "https://piston-data.mojang.com/v1/objects/fd19469fed4a4b4c15b2d5133985f0e3e7816a8a/client.jar" -o target.jar

      - name: jar2wasm.jarの読み込み
        run: |
          curl -vLi "https://repo.maven.apache.org/maven2/de/mirkosertic/bytecoder/bytecoder-cli/2023-05-19/bytecoder-cli-2023-05-19-executable.jar" -o "bytecoder-cli.jar"     
          curl -vLi "https://piston-meta.mojang.com/v1/packages/efcf0cda32d7ebf3ce3938d9add0179cfedeb0c0/1.20.4.json" -o version.json
          head -20 version.json
          # output.ll
    
      - name: 依存ライブラリ(JAR)の一括自動ダウンロード
        run: |
          echo "Parsing JSON and downloading libraries dynamically..."
          # urlとpathをタブ区切りで抜き出して1行ずつ処理する
          jq -r '.libraries[].downloads.artifact | select(. != null) | "\(.url)\t\(.path)"' version.json | while IFS=$'\t' read -r url path; do
            # 保存先のフォルダ階層を自動作成（例: ./libraries/com/mojang/logutils/...）
            mkdir -p "./libraries/$(dirname "$path")"
            echo "Downloading to ./libraries/$path ..."
            curl -sL "$url" -o "./libraries/$path"
          done


      - name: BytecoderによるWasm一括生成
        run: |
          echo "Constructing Comma-Separated Classpath for Bytecoder..."
          CLASSPATH_STR=$(find ./libraries -name "*.jar" | paste -sd, -)
          FULL_CLASSPATH="target.jar,$CLASSPATH_STR"
          
          mkdir -p ./dist
          
          java -jar bytecoder-cli.jar compile wasm \
            -classpath="$FULL_CLASSPATH" \
            -mainclass=net.minecraft.client.main.Main \
            -builddirectory=./dist || echo "Bytecoder finished with some status/errors"


      - name: テキスト形式 (WAT) の書き出し確認
        run: |
          # wasm2wat output.wasm -o output.wat
          # cat output.wat
          # https://repo.maven.apache.org/maven2/de/mirkosertic/bytecoder/bytecoder-cli/2023-05-19/bytecoder-cli-2023-05-19-executable.jar

      - name: 成果物（Wasm/JS）のアップロード
        uses: actions/upload-artifact@v4  # <-- ここを単数形の正しいアクション名に修正
        with:
          name: compiled-wasm-client
          path: ./dist/
